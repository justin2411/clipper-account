# ClipForge Worker: Cron (Scout/Publisher/Tracker/Notify) + API für Pipeline/Scripts + öffentliche Clip-Auslieferung (R2).
name = "clipforge"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[observability]
enabled = true

# Cron → Funktion (Zuordnung in src/index.ts). Zeiten UTC.
[triggers]
crons = [
  "*/10 * * * *",   # scout
  "*/30 * * * *",   # publisher
  "0 */6 * * *",    # tracker
  "0 18 * * *",     # notify – 20:00 Berlin (Sommer): Einreich-Liste, Tagesübersicht, montags Wochenreport
]

[[d1_databases]]
binding = "DB"
database_name = "clipforge"
database_id = "f699e8de-fb2c-4cac-b675-28f6906b7a28"      # scripts/cf_bootstrap.sh trägt die ID nach `wrangler d1 create clipforge` ein
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "clips"

# Nicht-geheime Konfiguration. Geheimnisse (BLOTATO_API_KEY, TELEGRAM_*, GMAIL_*, GITHUB_TOKEN, ACCOUNTS_JSON,
# CLIPFORGE_API_KEY) kommen per `wrangler secret put` bzw. scripts/cf_bootstrap.sh aus .env.
[vars]
PUBLISH_MODE = "live"                   # paid-Kampagnen: live (Blotato-Schedule) | shadow | draft
PUBLISH_MODE_FAN = "shadow"             # Fan-Content: shadow bis zur Freigabe (Publisher schreibt nur in D1, Tagesübersicht 20:00)
MAX_CLIPS_PER_DAY = "5"                 # Posts je Account/Tag im Dauerbetrieb (5 Slots alle 3–4 h, config/accounts.yaml)
RAMP_DAYS = "7"                         # neue Accounts: erste 7 Tage ab erstem Live-Post …
RAMP_MAX_PER_DAY = "3"                  # … höchstens 3 Posts/Tag
POST_GAP_MIN = "90"                     # Kollisionsschutz über alle Accounts und Quellen
PAID_SLOTS_PER_DAY = "2"                # aktive paid-Kampagne ersetzt 2 Fan-Slots je Account/Tag …
PAID_SLOTS_PER_DAY_MULTI = "3"          # … bei mehreren paid-Kampagnen 3
STOCK_DAYS = "3"                        # Vorproduktion: 3 Tage Vorrat fertiger Fan-Clips je Account
PLATFORM_GAP_MIN = "30"
GITHUB_REPO = "justin2411/clipper-account"
GITHUB_REF = "main"
