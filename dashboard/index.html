<!--
  DATENVERTRAG – GET {apiUrl}/dashboard, Header x-api-key. Ergänzt gegenüber v1:
  accounts[]: { id, handle, niche, platform:"tiktok", url, followers, followers_7d, views_7d, views_30d, earnings_30d, avg_views, posts_7d, paused, reason }
  niches[]:   { key, label, color, accounts:[ids] }
  sources[]:  { id, niche, name, size_mb, type:"paid|fan", stage:0..7, progress, clips, error, added, campaign_id }
              stage: 0 Upload · 1 Transkript · 2 Momentwahl · 3 Schnitt · 4 QA · 5 Geplant · 6 Gepostet · 7 Eingereicht
  posts[]:    { id, account, niche, url, thumb, caption, posted_at, views, likes, type, campaign }
  campaigns[] (+niche, paid_out_pct), totals, history, insights, tasks, pipeline, forecast, goal_monthly wie v1.
  tasks[]:    { id, kind:"submit|join|footage|review|calibrate", title, detail, niche, campaign_id, campaign_url, urls:[...], created, auto_check:true|false, done:false }
              submit: urls = Post-Links zum Einreichen (Worker hakt automatisch ab, wenn Vyro-Mail "approved" kommt, sonst per Knopf)
              join: campaign_url zum Beitreten; Worker hakt ab, wenn Kampagne in D1 auf "joined" steht (nach Footage-Setzen) oder per Knopf
              footage: Upload direkt in der Aufgabe (Nische vorgegeben); hakt sich nach erfolgreichem Upload selbst ab
              review: pausierter Account o.ä.; Knopf "Freigeben" -> POST /accounts/{id}/resume
  review[]:   { id, account, niche, source, campaign_id, video_url (R2, mp4), cover_url, caption, hook, duration, qa:{score, notes[]}, scores:{…}, scheduled_for, variant, probe, rank }
              probe:true = Clip aus einem Probelauf; dann drei Knöpfe statt Freigeben → POST /probe {campaign_id, action:"release|another|reject"}
  probe:      { open, campaign_id, campaign, video, round, blocked_ranks, clips[], probe, production, max_probe, max_production, waiting } -> GET /probe
              Obergrenze: ein Video im Probelauf, zwei Videos in Produktion; weitere Uploads warten.
              -> GET /review (Clips mit Status ready/scheduled, noch nicht gepostet)
  POST /review/{id}  { action:"approve|reject|redo|edit", feedback:"...", tags:["hook_zu_lang","start_frueher","falscher_moment",...], caption?, hook? }
              redo = neu rendern mit Feedback als Zusatzanweisung an Gemini; Feedback-Tags fließen als Few-Shot in Momentwahl & QA
  settings:   { global:{shadow}, niches:{ <key>: NicheSettings }, accounts:{ <id>: Partial<NicheSettings> (Overrides, leer = erbt von Nische) } }
              NicheSettings = { mode:"auto|review", platforms:["tiktok","instagram","youtube"], posts_per_day, slots:["14:00",...], min_gap_min, fan_ratio,
                cut:{ min_s, max_s, cold_open:true, pad_start_ms, pad_end_ms, silence_trim_s, word_boundary:true, end_style:"freeze|cut|none" },
                select:{ candidates, render_top, dedupe_s, weights:{surprise,stakes,reaction,cliffhanger,context,clarity}, min_score, context_line:true },
                visual:{ font, color, accent, outline_px, hook_y_pct, hook_max_words, hook_max_lines, zoom_pct, zoom_max_per_clip, zoom_ease_ms, safe_top_px, safe_bottom_px, safe_right_px, cover_text:true,
                         hook_size (px bei 1080 breit), hook_weight (400–900), hook_spacing (Buchstabenabstand px), hook_line_h, hook_align:"left|center|right", hook_x_pct, hook_w_pct (Textbox-Breite), hook_case:"upper|none",
                         box:"none|solid|blur", box_color, box_opacity (0–100), box_pad, box_radius, shadow (0–6), anim:"none|pop|slide|typewriter", accent_mode:"none|last2|first|keyword",
                         overlay:{ show:"auto|always|never" (auto = nur wenn Kampagne einen Pflichttext vorgibt), text (leer = Kampagnentext bzw. Kontext-Zeile),
                                   font, size, weight, color, case, y_pct, x_pct, w_pct, align, box, box_color, box_opacity, box_pad, box_radius, outline_px, shadow, lines,
                                   anim:"none|fade|slide", duration (Sekunden, 0 = ganzer Clip) },
                         cover:{ mode:"hook|custom|none" (hook = Hook-Text als Cover-Titel, custom = eigener Text, none = nur Bild),
                                 text, font, size, weight, color, accent, case, align, y_pct, x_pct, w_pct, max_words, lines, outline_px, shadow,
                                 box, box_color, box_opacity, box_pad, box_radius,
                                 frame:"motion|face|first|manual" (Auswahl des Standbilds), frame_skip_s (erste n Sekunden überspringen), dim (Bild abdunkeln 0–60 %) } },
                audio:{ lufs, true_peak, normalize:true },
                caption:{ template:"{hook} · Credit @mrbeast #mrbeast", hashtags:[...], pinned_comment:true, tone:"knapp|locker" },
                qa:{ threshold, checks:{hook_legible,no_overlap,face_in_frame,not_blurry,safe_zone} } }
              -> GET /settings, PUT /settings (validiert; ohne confirm:true nur Diff {preview:true, diff:[{field,old,new,accounts}]}; mit confirm:true schreiben → {version, diff})
              Stufe 3: settings_versions:[{id, created_at, changes, diff}] (letzte 10) · GET /settings/versions · POST /settings/reset {version?|defaults, confirm} (ohne confirm nur Diff)
              Upload läuft in 25-MB-Teilen über PUT {upload_url}?part=N (Header x-api-key), dann POST /sources/complete
  POST /review/{id} approve  -> Clip wird sofort in den nächsten freien Slot des Accounts geplant und automatisch gepostet
  POST /review/bulk { ids:[...], action:"approve" }
  POST /tasks/{id}/done  -> markiert erledigt.   POST /accounts/{id}/resume -> Kill-Switch aufheben.
  Upload: POST /sources/presign {niche,name,size,type} -> {upload_url,source_id}; PUT upload_url (Browser→R2); POST /sources/complete {source_id}
  report (Stufe 2): { latest: WeeklyReport|null, weeks:[{week, generated_at, posts, views, payouts_usd}] }
              WeeklyReport = { week:"2026-W36", from, to, partial, totals:{posts,live,shadow,views,avg_views,likes,followers_delta,payouts_usd,costs_usd,clips,clips_rejected,submitted,qualified_rate},
                prev:{posts,views,avg_views,payouts_usd,followers_delta}|null, by_kind:[{kind,posts,views,avg_views,clips,rejected}], accounts:[{id,handle,niche,posts,live,shadow,views,avg_views,likes,followers,followers_delta,best:{url,views,hook}|null,under_200,paused}],
                top_posts:[{url,account,views,likes,hook,kind,campaign,posted_at}], learned:{best_slot,best_hook_type,best_font,best_account}, suggestions:[{text,action?:{kind,label,href}}], summary:[3 Sätze] }
              -> GET /report?week=latest|current|<YYYY-Www> (Dashboard-Key), GET /report/weeks. Sonntags 09:00 Berlin: Bericht in kv + Telegram-Kurzfassung mit Link auf #report.
              WeeklyReport zusätzlich: ab:{variable,leader,lift_pct,hint,variants:[{value,posts,avg_views}]}|null, changes:[{at,text}] (was das System umgestellt hat)
  PWA (Nachtrag 8): /manifest.webmanifest + /sw.js (App-Shell offline, Daten immer aus dem Netz), Icons /icon-192.png und /icon-512.png.
              Installierbar über „Zum Startbildschirm"; Hinweis im Kopf der Übersicht, wenn der Browser das Installieren anbietet.
              Web-Push ist im Service Worker vorbereitet (push/notificationclick, Nachricht {title, body, url}) – die Anmeldung folgt, sobald VAPID-Schlüssel gesetzt sind; bis dahin informiert Telegram.
  anomalies (Nachtrag 7): { at, found:[{key, severity:"warn|alert", title, detail, question}] } -> GET /anomalies (letzter Lauf) · GET /anomalies?live=1 (jetzt prüfen)
              Cron täglich 06:00 UTC: neue Anomalien landen im Posteingang (mit „Erklären"-Link in den Chat), je Anomalie höchstens einmal in 24 h.
              Wochenbericht sonntags: das starke Modell schreibt die 3 Sätze und 3 Vorschläge (report.latest.by = "analysis"), sonst die Regelfassung.
  library (Nachtrag 6): { total, limit, offset, items:[{id, account, status, created_at, hook, caption, duration_s, media_url, cover, score, scores, qa, variant, campaign, kind, niche, views, post_url, platforms:[..], reusable}],
              filters:{statuses:{status:n}, sources:[{id,name,kind,n}], accounts:[..]} }
              -> GET /library?q=&status=&account=&source=&min_score=&min_views=&sort=new|views|score|oldest&limit=&offset=
              POST /library/{clip}/reuse {platform:"instagram|youtube|tiktok"} legt einen neuen Clip (Status ready) mit derselben Datei an; der Publisher plant ihn im nächsten freien Slot.
  payouts (Nachtrag 5): { days, since, totals:{expected_usd, paid_usd, open_usd, cost_usd, margin_usd, clips, posts, cost_per_clip_usd, month_paid_usd, unassigned_usd},
              campaigns:[{id, name, platform, kind, status, rate_per_1k, min_views, posts, posts_with_views, submitted, views, clips, expected_usd, paid_usd, open_usd, proration_pct, cost_usd, cost_per_clip_usd, margin_usd, margin_pct, payouts:[{amount_usd, source, at}]}],
              posts:[{id, at, account, campaign, kind, hook, views, expected_usd, submitted, url}], payouts:[…], unassigned:[…], note }
              -> GET /payouts?days=90 · CSV: ?csv=1 (Kampagnen) und ?csv=posts. Erwartet = Views/1000 × Rate, gedeckelt durch max_per_post_usd, unter min_views zählt der Post nicht;
              Kosten = gebuchte Kosten + 0,01 $ je Clip + Blotato (29 $/Monat) anteilig nach Clip-Anzahl.
  calendar (Nachtrag 4): { from, to, week_offset, days:[YYYY-MM-DD ×7], accounts:[{id, handle, niche, slots, posts_per_day, min_gap_min, paused, paused_until}],
              items:[{id, clip_id, account, at, status, mode, kind, hook, cover, duration_s, campaign, campaign_id, niche, url, views, movable, media_url, caption, scores, qa}] }
              Klick auf einen Eintrag öffnet die Clip-Vorschau (Video aus media_url, Hook, Caption, Scores, QA); Verschieben weiterhin per Drag bzw. über den Knopf „Verschieben".
              -> GET /calendar?week=0|-1|1 · POST /calendar/move {post_id, at} (Kollisionsschutz: Mindestabstand und Tageslimit des Accounts; Schatten-Post umdatieren, Live-Post über Blotato neu planen)
  chat (Nachtrag 3): { enabled, budget:{day, used_usd, calls, limit_usd, exhausted} }
              -> POST /chat {conversation_id?, message, context:{page,niche,account}, force?:"analysis"} → { conversation_id, reply:{text, more, sources:[{tool,rows}], tier:"data|analysis|action", how, model, usd, action?:{id,tool,args,label,confirm_token}}, budget }
              GET /chat (Konversationen) · GET /chat/:id (Verlauf) · POST /chat/confirm {action_id, confirm_token} bzw. {action_id, cancel:true}
              Handelnde Tools werden nur vorgeschlagen; Ausführung erst nach Bestätigung im UI. Deep-Link: #chat:<Frage> stellt die Frage direkt.
  inbox (Nachtrag 2): { items:[{id, kind, title, text, photo_url, sent_telegram, read, done, created_at, explain}], counts:{unread, open, total, <kind>…}, kinds:{key:label}, rules:{<kind>:{telegram, push}}, next_before }
              -> GET /inbox?filter=unread|open|done|all&kind=&before= · POST /inbox/{id|all}/{read|done|unread|reopen} · GET/PUT /inbox/rules. Jede Telegram-Nachricht (Text/Foto) wird gespiegelt;
              Regel telegram=false unterdrückt den Versand (Eintrag bleibt). „Erklären" → #chat:<Erkläre: Titel>. Push folgt mit der PWA (Nachtrag 8).
  accounts[].metrics: "ok" | "pending" – pending heißt, Blotato hat für diesen Account noch nie Views abgerufen; views_7d/views_30d/avg_views sind dann null und werden als „–" gezeigt, nicht als 0.
  POST /reconcile?days=14 gleicht veröffentlichte Blotato-Posts mit D1 ab (GET = Vorschau): fehlende URLs nachtragen, unbekannte Posts als Kampagne „extern" anlegen. Läuft auch im Tracker mit.
  accounts[].health (Nachtrag 1): { color:"green|yellow|red|grey", headline, reasons:[..], question:"Warum ist A rot?",
              metrics:{posts_with_views, avg_last10, avg_prev10, trend_pct, under_200_pct, engagement_pct, days_since_post, paused, pause_reason, kill_switches_30d}, history:[{at,text}] }
              Ampel in Rangliste/Nischen-Karten (Tiefe 1), Kennzahlen per Klick (Tiefe 2), Kill-Switch-Historie (Tiefe 3); rot/gelb → Deep-Link #chat:<Frage>
  suggestions: { <niche>: { fresh:[Kandidat], archive:[Kandidat], items:[…], blocked, unrated } } -> GET /catalog?niche=
              Kandidat = {id, title, url, channel, duration_s, views, published_at, age_days, list:"fresh|archive", score, fit_a, fit_b, account, rank_value, height, reason}
              frisch = letzte 14 Tage (neueste zuerst), Archiv = älter als 6 Monate (Aufrufe × Bewertung). Gesperrt: Video in den letzten 90 Tagen schon verwendet. (alt: GET /suggest?niche= nach Aufrufen;
              verwendete Videos und Quellen unter der Mindestlänge ausgeschlossen). POST /suggest/pick {video_id} → Quelle needs_download (sources[].pending, auto = automatisch gewählt) + Aufgabe
              "Video herunterladen & hochladen" (urls=[YouTube-Link]); Upload in der Aufgabe (presign mit video_id) hängt sich an die Quelle. POST /suggest/cancel {upload_id}.
              Automatik: Vorrat < settings.niches.<key>.stock_days (Regler "Vorrat in Tagen", Standard 2) → oberster Vorschlag automatisch, Telegram informiert.
  onboarding (Stufe 6): { steps:[{key:"accounts|vyro|niche|look|shadow|live", label, done, detail, href, hint?}], done, total, complete } -> GET /onboarding
              Übersicht zeigt die Checkliste, bis complete; danach unter #start. Status aus echten Daten (Secrets, Blotato-IDs, Kampagnen, Versionen, Schatten-/Live-Posts).
  log (Stufe 5): { items:[{id, at, campaign_id, text, cat:"error|reject|killswitch|upload|post|job|settings|other", run_id}], counts:{all,error,...}, repo, next_before, cats:{key:label} }
              -> GET /log?cat=&q=&limit=&before=<id> (Dashboard-Key). run_id aus "run=<id>" im Ereignis (Pipeline hängt GITHUB_RUN_ID an) → Link https://github.com/<repo>/actions/runs/<id>
  ab (Stufe 4): { experiment:{variable,variants:[..],niche,started_at}|null, variants:[{value,clips,posts,views,avg_views,likes,engagement,watchtime,completion}], min_n:20, significant, leader, lift_pct, hint, variables:{<pfad>:{label,values?,kind}} }
              -> GET /ab · POST /ab {variable,variants:[a,b],niche} · POST /ab/stop · POST /ab/apply {value, confirm} (ohne confirm nur Diff) – Gewinner wird in die Nische geschrieben (Version), Test endet.
              Pipeline liest GET /api/settings/effective (Feld ab) und rendert Clips abwechselnd mit den Varianten (clips.variant = "<variable>=<wert>").
-->
<style>
:root{--bg:#0C0D12;--panel:#14161D;--panel2:#1A1D26;--line:#262A35;--ink:#F2F1EC;--ink2:#A9ABB6;--ink3:#6B6E7B;
 --flame:#FF5A1F;--violet:#8B5CF6;--gold:#FACC15;--ok:#3DD68C;--warn:#F5A524;--bad:#F0564A;--r:14px;--font:"Manrope",system-ui,sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F4F3EF;--panel:#FFFFFF;--panel2:#F8F7F3;--line:#E4E2DB;--ink:#16171C;--ink2:#5B5E6B;--ink3:#8E909B}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.45}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:4px 6px 18px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#FF7A3D,#FF5A1F 55%,#E8410A);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(255,90,31,.35);flex:none}
.brand .mk svg{width:17px;height:17px}
.nl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.nl:hover{background:var(--panel2)}.nl.on{background:var(--panel2);color:var(--ink)}
.nl .sw{width:10px;height:10px;border-radius:50%;flex:none}
.nl small{margin-left:auto;font-weight:500;color:var(--ink3);font-size:12px}
.navcur,.burger{display:none}
.nh{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:16px 10px 6px}
main{padding:22px 26px 60px;max-width:1280px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:24px;margin:0;letter-spacing:-.02em;font-weight:800}
.top .meta{font-size:13px;color:var(--ink3);display:flex;gap:10px;align-items:center}
.live{font-size:12px;color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:6px}.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,214,140,.5)}70%{box-shadow:0 0 0 8px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}
button.b{font:inherit;font-weight:700;font-size:13px;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
h2{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}h2 span{font-size:12px;font-weight:500;color:var(--ink3)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.kpi span{font-size:12px;color:var(--ink3)}.kpi small{display:block;font-size:12px;color:var(--ok);font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.rank{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.rank.g{background:var(--gold);color:#111}.rank.s{background:#C0C0C0;color:#111}.rank.b{background:#CD7F32;color:#111}
.acct{display:flex;align-items:center;gap:10px}.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.acct .h{font-weight:700}.acct .h a:hover{text-decoration:underline}.acct .n{font-size:11px;color:var(--ink3)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.pill.v{background:color-mix(in srgb,var(--violet) 18%,transparent);color:#B197FF}.pill.f{background:color-mix(in srgb,var(--flame) 18%,transparent);color:var(--flame)}
.nhead{display:flex;align-items:center;gap:14px}.nhead .sw{width:14px;height:14px;border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:block}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card .stats div{font-size:11px;color:var(--ink3)}.card .stats b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.card .links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.card .links a{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.step{padding:8px 6px 6px;border-radius:8px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:11px;color:var(--ink3)}
.step b{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 4px;background:var(--line);color:var(--ink2);font-size:10px;line-height:18px;font-weight:800}
.step.done{color:var(--ink2)}.step.done b{background:var(--ok);color:#111}
.step.cur{border-color:var(--flame);color:var(--ink)}.step.cur b{background:var(--flame);color:#fff;animation:pulse2 1.4s infinite}
.step.err{border-color:var(--bad);color:var(--bad)}.step.err b{background:var(--bad);color:#fff}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,90,31,.5)}70%{box-shadow:0 0 0 7px rgba(255,90,31,0)}100%{box-shadow:0 0 0 0 rgba(255,90,31,0)}}
.src{padding:12px 0;border-top:1px solid var(--line)}.src:first-of-type{border-top:0}
.src .t{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.src .t b{font-size:14px}.src .t span{font-size:12px;color:var(--ink3)}
.src .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}.src .bar i{display:block;height:100%;background:var(--flame);transition:width 1.2s ease}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink3);font-size:13px;cursor:pointer}.drop.over{border-color:var(--flame);color:var(--ink)}.drop b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.up{font-size:12px;color:var(--ink2);margin-top:8px;min-height:16px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.post{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:block}
.post .th{aspect-ratio:9/16;background:linear-gradient(160deg,var(--panel2),var(--line));display:flex;align-items:flex-end;padding:8px;background-size:cover;background-position:center}
.post .th span{background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px;font-weight:700;font-size:11px}
.post .c{padding:8px;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stage{position:relative;padding:12px 12px 12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.stage:after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:18px}.stage:last-child:after{content:""}
.stage .st{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}.dot.ok{background:var(--ok)}.dot.error{background:var(--bad)}.dot.running{background:var(--flame);animation:pulse2 1.4s infinite}
.stage .si{font-size:11px;color:var(--ink3);margin-top:4px}
/* animated flow */
.flowwrap{position:relative}
.wires{display:grid;grid-template-columns:repeat(5,1fr);height:34px;margin:2px 0 -6px}
.wire{position:relative;height:34px}
.wire svg{position:absolute;left:50%;right:-50%;width:100%;height:34px;overflow:visible}
.wire path.l{fill:none;stroke:var(--line);stroke-width:2}
.wire path.a{fill:none;stroke:var(--flame);stroke-width:2;stroke-dasharray:6 10;animation:dash 1.2s linear infinite;opacity:.9}
@keyframes dash{to{stroke-dashoffset:-32}}
.wire.ok path.a{stroke:var(--ok);animation-duration:2.4s;opacity:.5}
.dotm{fill:var(--flame);filter:drop-shadow(0 0 4px var(--flame))}
.wire.ok .dotm{fill:var(--ok);filter:drop-shadow(0 0 4px var(--ok))}
.stage.running{box-shadow:inset 0 0 0 1px var(--flame)}
.stage .cnt{position:absolute;top:8px;right:10px;font-size:10px;font-weight:800;color:var(--flame);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.steps .step.cur{background:color-mix(in srgb,var(--flame) 8%,var(--panel))}
.stepwire{height:6px;margin:-2px 4px 0;background:linear-gradient(90deg,var(--ok) 0,var(--ok) var(--p),var(--line) var(--p));border-radius:3px;position:relative;overflow:hidden}
.stepwire i{position:absolute;top:0;bottom:0;width:26px;background:linear-gradient(90deg,transparent,var(--flame),transparent);animation:slide 1.6s linear infinite;left:calc(var(--p) - 40px)}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.tick{font-variant-numeric:tabular-nums}
.ev{font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}.ev:first-of-type{border-top:0}.ev time{color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.task:first-of-type{border-top:0}.task b{width:8px;height:8px;border-radius:50%;flex:none;background:var(--flame)}.task.join b{background:var(--gold)}.task.review b{background:var(--warn)}.task a{color:var(--ink2);font-size:12px;margin-left:auto}
/* studio */
.rv{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:0}
.rv video,.rv .ph{width:150px;aspect-ratio:9/16;border-radius:10px;background:linear-gradient(160deg,var(--panel2),var(--line));object-fit:cover;display:block}
.rv .ph{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px}
.rv .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rv .hk{font-weight:800;font-size:15px}.rv .mt{font-size:12px;color:var(--ink3);margin-top:2px}
.rv .cap{font-size:12px;color:var(--ink2);margin-top:8px;background:var(--panel2);border-radius:8px;padding:8px 10px}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sc span{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}.sc span b{color:var(--ink)}
.qa{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}.qa.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.qa.y{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.qa.r{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.fb button{font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}.fb button.on{background:var(--panel2);color:var(--ink);border-color:var(--ink3)}
.act{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.act button{font:inherit;font-size:12px;font-weight:800;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.act .ok{background:var(--ok);border-color:var(--ok);color:#111}.act .no{color:var(--bad)}.act .re{background:var(--flame);border-color:var(--flame);color:#fff}
.act input{font:inherit;font-size:12px;flex:1;min-width:160px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tab{font:inherit;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}.tab.on{background:var(--panel2);color:var(--ink);border-color:var(--ink3)}
/* simple mode */
.simple{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.sc-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.sc-card h3{margin:0 0 4px;font-size:14px;font-weight:800}.sc-card p{margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.45}
.sc-card .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-weight:700;margin-top:4px}
.sc-card input[type=range]{width:100%;accent-color:var(--flame)}
.sc-card .now{font-size:12px;color:var(--ink);margin-top:6px;background:var(--panel);border-radius:8px;padding:6px 10px}
.sc-card .opts{display:flex;gap:6px;flex-wrap:wrap}.sc-card .opts button{font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}.sc-card .opts button.on{background:var(--flame);border-color:var(--flame);color:#fff}
.prev{position:sticky;top:20px}
.frame{width:100%;aspect-ratio:9/16;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(180deg,#2b3140,#141722 60%,#0d0f16);border:1px solid var(--line)}
.frame .sz{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px)}
.frame .ui{position:absolute;right:10px;bottom:22%;display:flex;flex-direction:column;gap:14px}.frame .ui i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.frame .capbar{position:absolute;left:10px;right:56px;bottom:6%;height:22px;border-radius:6px;background:rgba(255,255,255,.12)}
.frame .hook{position:absolute;font-weight:900;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase}
/* Textkästen sind nur so hoch wie ihr Inhalt: keine Streckung, keine Mindesthöhe, rechts und unten offen.
   Die Breite kommt weiterhin vom Regler (w_pct als inline-Breite). */
.frame .hook,.frame .ovl{height:auto;min-height:0;max-height:none;right:auto;bottom:auto;box-sizing:border-box;pointer-events:auto;display:block}
.frame .ovl{z-index:2}.frame .hook{z-index:3}
/* Alles Dekorative liegt darüber, nimmt aber keine Klicks an – nur Hook und Overlay sind anfassbar. */
.frame video,.frame img.bg,.frame .face{z-index:0;pointer-events:none}
.frame .sz,.frame .ui,.frame .capbar,.frame .guide,.frame .pos,.frame .zoomlbl{z-index:4;pointer-events:none}
@keyframes hookpop{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes hookslide{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes hooktype{from{width:0}to{width:var(--w,84%)}}
.frame .ovl{position:absolute}
@keyframes ovfade{from{opacity:0}to{opacity:1}}
@keyframes ovslide{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.frame .face{position:absolute;left:50%;top:38%;width:34%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 40% 35%,#d9b08c,#8a6a52);opacity:.85}
.prev .cap{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.4}
.pv-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pv-tools button,.pv-tools select{font:inherit;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}.pv-tools button.on{background:var(--panel2);color:var(--ink);border-color:var(--ink3)}
.frame{background:#101218}
.frame .hook,.frame .ovl{cursor:grab;transition:none}
.frame .hook:hover,.frame .ovl:hover{outline:1px dashed color-mix(in srgb,var(--flame) 60%,transparent);outline-offset:3px}
.frame .hook.dragging,.frame .ovl.dragging{cursor:grabbing;outline:1px solid var(--flame);outline-offset:3px}
.frame .hook[contenteditable="true"],.frame .ovl[contenteditable="true"]{outline:1px solid var(--flame);outline-offset:3px;cursor:text}
.guide{position:absolute;background:color-mix(in srgb,var(--flame) 70%,transparent);pointer-events:none;opacity:0;transition:opacity .12s}
.guide.x{top:0;bottom:0;width:1px}.guide.y{left:0;right:0;height:1px}
.guide.on{opacity:.8}
.pos{position:absolute;left:8px;bottom:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:6px;opacity:0;transition:.15s}
.pos.on{opacity:1}
.fmt{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:8px}
.fmt button{font:inherit;font-size:12px;font-weight:700;min-width:30px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}
.fmt button.on{background:var(--flame);border-color:var(--flame);color:#fff}
.fmt .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.fmt .lb{font-size:11px;color:var(--ink3);font-weight:700;margin-right:2px}
.fmt input[type=color]{width:28px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent}
.frame video,.frame img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .zoomlbl{position:absolute;left:8px;top:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px}
.frame .z{animation:punch var(--zd,1.6s) ease-in-out infinite alternate}
@keyframes punch{from{transform:scale(1)}to{transform:scale(var(--zs,1.08))}}
.frame .hidden-ui .sz,.frame .hidden-ui .ui,.frame .hidden-ui .capbar{display:none}
.cover{width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;position:relative;background:linear-gradient(180deg,#2b3140,#0d0f16);border:1px solid var(--line)}
.cover .ct{position:absolute;font-weight:900;line-height:1.02;overflow:hidden}
.cover .lb{position:absolute;left:6px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.diff{margin-top:10px;font-size:12px;color:var(--ink2)}.diff b{color:var(--ink)}.diff .d{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}.diff .d span:last-child{color:var(--flame);font-weight:700}
/* how it works */
.how{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.hnode{cursor:pointer}.hnode rect{transition:.15s}.hnode.on rect{stroke:var(--flame);stroke-width:2}
.hinfo h3{margin:0 0 6px;font-size:16px;font-weight:800}.hinfo p{margin:0 0 10px;font-size:13px;color:var(--ink2);line-height:1.5}
.hinfo .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}.hinfo .kv span{color:var(--ink3)}
.hinfo .who{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:8px}.who.a{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.who.m{background:color-mix(in srgb,var(--flame) 18%,transparent);color:var(--flame)}
.hmore{margin-top:8px}.hmore summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--ink2)}.hmore ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--ink2)}
/* how cards */
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden}
.hcard:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--flame) 8%,transparent),transparent 55%);opacity:0;transition:.18s}
.hcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--flame) 45%,var(--line));box-shadow:0 8px 22px rgba(0,0,0,.25)}
.hcard:hover:before{opacity:1}
.hcard .hic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--flame) 12%,transparent);border:1px solid color-mix(in srgb,var(--flame) 30%,transparent);color:var(--flame);margin-bottom:10px}
.hcard .hic svg{width:18px;height:18px}
.hcard.m .hic{background:color-mix(in srgb,var(--flame) 20%,transparent);color:var(--flame)}
.hcard.a .hic{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--ok)}
.hcard .hn{position:absolute;top:12px;right:14px;font-size:11px;font-weight:800;color:var(--ink3)}
.hcard b{display:block;font-size:14px;margin-bottom:3px;position:relative}
.hcard span{font-size:11.5px;color:var(--ink3);line-height:1.4;display:block;position:relative}
.hcard .harrow{position:absolute;right:14px;bottom:12px;color:var(--ink3);font-style:normal;transition:transform .18s}
.hcard:hover .harrow{transform:translateX(3px);color:var(--flame)}
.hloop{display:flex;align-items:center;gap:10px;margin:10px 2px 0;font-size:11px;color:var(--ink3)}
.hloop svg{width:180px;height:26px;flex:none}
.hleg{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink2)}
.hleg .d{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.hleg .d.a{background:var(--ok)}.hleg .d.m{background:var(--flame)}
.lensic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--flame) 12%,transparent);border:1px solid color-mix(in srgb,var(--flame) 30%,transparent);color:var(--flame);flex:none}
.lensic svg{width:22px;height:22px}
@media (max-width:860px){.hgrid{grid-template-columns:1fr 1fr}.hloop svg{width:120px}}
/* x-ray */
.xr{position:relative;min-height:420px}
.xr .lvl{transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.xr .lvl.out{opacity:0;transform:scale(1.06);pointer-events:none;position:absolute;inset:0}
.xr .lvl.in{animation:zoomin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.xnode{cursor:pointer;transition:transform .2s}.xnode:hover{transform:translateY(-2px)}
.xnode rect{transition:stroke .2s,filter .2s}.xnode:hover rect{stroke:#8E909B}
.xnode.m rect{stroke:rgba(255,90,31,.5)}
.xdot{fill:#3DD68C;filter:drop-shadow(0 0 4px #3DD68C)}.xdot.m{fill:#FF5A1F;filter:drop-shadow(0 0 4px #FF5A1F)}
.lens{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.lens:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 20%,rgba(255,90,31,.12),transparent 40%),radial-gradient(circle at 80% 80%,rgba(139,92,246,.12),transparent 40%);animation:drift 12s linear infinite;pointer-events:none}
@keyframes drift{to{transform:rotate(360deg)}}
.lens .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px;position:relative}.lens .hd h3{margin:0;font-size:20px;font-weight:800}
.lens .bk{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.lens p{position:relative;font-size:13.5px;color:var(--ink2);margin:0 0 12px;line-height:1.5;max-width:760px}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;position:relative}
.sub .sn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;position:relative;transition:transform .2s,border-color .2s;animation:pop .4s both}
.sub .sn:hover{transform:translateY(-2px);border-color:var(--ink3)}.sub .sn.on{border-color:var(--flame)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sub .sn b{display:block;font-size:13px;margin-bottom:3px}.sub .sn span{font-size:11px;color:var(--ink3);line-height:1.4;display:block}
.sub .sn i{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
.sub .sn:after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--ink3)}.sub .sn:last-child:after{content:""}
.sub .conn{grid-column:1/-1;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ok),transparent);background-size:200% 100%;animation:sweep 1.8s linear infinite;margin:-4px 0 2px}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
.det{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;animation:pop .35s both}
.det h4{margin:0 0 6px;font-size:14px;font-weight:800}.det p{margin:0 0 8px;font-size:12.5px}
.det .kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--line)}.det .kv span{color:var(--ink3)}
.det a.tune{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--flame)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;position:relative}.facts div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--ink3)}.facts b{display:block;font-size:14px;color:var(--ink)}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:10px}.crumb a{color:var(--ink2);font-weight:700}
/* forecast */
.fc-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.fc-big{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.fc-big div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}.fc-big b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.fc-big span{font-size:12px;color:var(--ink3)}
.fc-chart{height:240px}
.fc-p{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.fc-p label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-weight:700}.fc-p label b{color:var(--ink)}.fc-p input{width:100%;accent-color:var(--flame)}.fc-p small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.ist{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);margin-top:6px}
.ist b{color:var(--ink)}
.ist.up b{color:var(--warn)}.ist.dn b{color:var(--ok)}
.ist button{font:inherit;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;margin-left:auto}
.ist.none{color:var(--ink3);opacity:.7}

function stepper(s){const pct=Math.min(100,((s.stage+(s.progress||0))/STAGES.length)*100);
  return `<div class="steps">${STAGES.map((n,i)=>{const cls=s.error&&i===s.stage?"err":i<s.stage?"done":i===s.stage?"cur":"";return `<div class="step ${cls}"><b>${i<s.stage?"✓":i+1}</b>${n}</div>`}).join("")}</div><div class="stepwire" style="--p:${pct}%">${(!s.error&&s.stage<7)?`<i></i>`:""}</div>`}

function wire(active,ok){const cls=active?(ok?"wire ok":"wire"):"wire";
  return `<div class="${cls}"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><path class="l" d="M0 17 H100"/>${active?`<path class="a" d="M0 17 H100"/><circle class="dotm" r="3"><animateMotion dur="${ok?"2.6s":"1.3s"}" repeatCount="indefinite" path="M0 17 H100"/></circle><circle class="dotm" r="2.2" opacity=".7"><animateMotion dur="${ok?"2.6s":"1.3s"}" begin="0.6s" repeatCount="indefinite" path="M0 17 H100"/></circle>`:""}</svg></div>`}
function pipelineBlock(d,compact){const pl=d.pipeline||{stages:[],jobs:[],queue:{},events:[]};const st=pl.stages;

  return `<div class="flowwrap"><div class="flow">${st.map(s=>`<div class="stage ${s.status}"><div class="st"><span class="dot ${s.status}"></span>${s.label}</div>${s.status==="running"?`<span class="cnt">● läuft</span>`:""}<div class="si">${s.info||""}</div></div>`).join("")}</div><div class="wires">${wires}</div></div>

  ${compact?"":`<div style="margin-top:12px">${(pl.events||[]).slice(0,12).map(e=>`<div class="ev"><time>${tm(e.at)}</time><div>${e.text}</div></div>`).join("")}</div>`}`}

function wireReport(d){document.querySelectorAll("[data-week]").forEach(b=>b.onclick=async()=>{if(DEMO_MODE||!cfg)return;const st=$("#repstat");if(st)st.textContent="lädt …";

function taskCard(t,d){const n=nicheOf(d,t.niche);const TICO={submit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
  join:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  footage:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3"/></svg>`,
  review:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>`,
  calibrate:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>`};
  const icon=TICO[t.kind]||TICO.calibrate;
  let tools="";
  if(t.kind==="submit")tools=`<div class="urls">${(t.urls||[]).join("<br>")}</div><div class="tools"><button class="go" data-copy="${t.id}">Links kopieren</button><a href="${t.campaign_url}" target="_blank" rel="noopener">Vyro öffnen ↗</a></div>`;
  if(t.kind==="join")tools=`<div class="tools"><a class="go" href="${t.campaign_url}" target="_blank" rel="noopener">Kampagne öffnen & Join ↗</a></div>`;
  if(t.kind==="footage"){const vid=((t.urls||[])[0]||"").match(/[?&]v=([\w-]{6,})/)?.[1]||"";tools=`${vid?`<div class="tools"><a class="go" href="${t.urls[0]}" target="_blank" rel="noopener">YouTube öffnen ↗</a><span style="font-size:12px;color:var(--ink3)">herunterladen, dann hier hochladen</span></div>`:""}<div class="drop" data-niche="${t.niche}" data-task="${t.id}" data-video="${vid}"><b>Video für „${n?.label||t.niche}" hierher ziehen</b>startet die Clip-Jobs und hakt die Aufgabe ab<input type="file" accept="video/*" multiple style="display:none"></div><div class="up"></div>`}
  if(t.kind==="review")tools=`<div class="tools"><button class="go" data-resume="${t.account}">Account ${t.account} freigeben</button><a href="#n:${t.niche}">Nische ansehen</a></div>`;
  return `<div class="tk ${t.kind}"><div class="ic">${icon}</div><div><div class="ti">${t.title}</div><div class="td">${t.detail||""} · ${ago(t.created)}</div>${tools}${t.auto_check?`<div class="auto">✓ hakt sich automatisch ab, sobald das System das Ergebnis sieht</div>`:""}</div><button class="done" data-done="${t.id}">Erledigt</button></div>`}
function wireTasks(d){
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{if(DEMO_MODE){b.closest(".tk").style.opacity=.35;b.textContent="✓";return}await fetch(cfg.apiUrl+"/tasks/"+b.dataset.done+"/done",{method:"POST",headers:{"x-api-key":cfg.apiKey}});refresh()});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const t=(d.tasks||[]).find(x=>x.id===b.dataset.copy);await navigator.clipboard.writeText((t.urls||[]).join("\n"));b.textContent="Kopiert ✓";setTimeout(()=>b.textContent="Links kopieren",1500)});
  document.querySelectorAll("[data-resume]").forEach(b=>b.onclick=async()=>{if(DEMO_MODE){b.textContent="Freigegeben ✓";return}await fetch(cfg.apiUrl+"/accounts/"+b.dataset.resume+"/resume",{method:"POST",headers:{"x-api-key":cfg.apiKey}});refresh()});
  document.querySelectorAll(".tk .drop").forEach(drop=>{const file=drop.querySelector("input"),stat=drop.nextElementSibling;
    drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");up([...e.dataTransfer.files])};file.onchange=()=>up([...file.files]);
    async function up(files){if(DEMO_MODE||!cfg){stat.textContent="Beispielmodus – Upload erst mit verbundenem Worker.";return}
      for(const f of files){try{stat.textContent=`${f.name}: vorbereiten…`;const pre=await (await fetch(cfg.apiUrl+"/sources/presign",{method:"POST",headers:{"x-api-key":cfg.apiKey,"Content-Type":"application/json"},body:JSON.stringify({niche:drop.dataset.niche,name:f.name,size:f.size,type:"fan",task_id:drop.dataset.task,video_id:drop.dataset.video||undefined})})).json();
        if(pre.error)throw new Error(pre.error);await putChunked(pre,f,(pct,i,n)=>{stat.textContent=`${f.name}: ${pct} % (Teil ${i}/${n})`});
        await fetch(cfg.apiUrl+"/sources/complete",{method:"POST",headers:{"x-api-key":cfg.apiKey,"Content-Type":"application/json"},body:JSON.stringify({source_id:pre.source_id,task_id:drop.dataset.task})});
        stat.textContent=`${f.name}: fertig.`}catch(err){stat.textContent=`${f.name}: ${err.message}`}}
      refresh()}});}

const SIMPLE={

function simpleView(N,n,d){

  return `<section><h2>A/B-Test: ${lbl} <span>${ex.variable} · seit ${tm(ex.started_at)} · Nische ${nicheOf(d,ex.niche)?.label||ex.niche}</span></h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${ab.variants.map(v=>`<div class="abv ${ab.leader===v.value?"lead":""}"><div class="t"><span>${v.value}</span>${ab.leader===v.value?`<span class="pill ok">${ab.significant?"Gewinner":"Tendenz"}</span>`:""}</div><b>${fmt(v.avg_views)}</b> <span class="m">Ø Views</span>
      <div class="m" style="margin-top:6px"><span>${v.clips} Clips</span><span>${v.posts} gepostet</span><span>${fmt(v.views)} Views</span><span>${v.engagement==null?"–":v.engagement+" %"} Engagement</span><span>Watchtime ${v.watchtime==null?"–":v.watchtime+" s"}</span><span>Completion ${v.completion==null?"–":v.completion+" %"}</span></div></div>`).join("")}</div>
    <div class="up" style="margin-top:10px;color:${ab.significant?"var(--ok)":"var(--ink2)"}">${ab.significant?"✓":"ℹ"} ${ab.hint}</div>
    <div class="tools" style="margin-top:10px">${ab.leader?`<button class="save" data-abapply="${ab.leader}">Gewinner übernehmen: ${ab.leader}</button>`:""}${ab.variants.filter(v=>v.value!==ab.leader).map(v=>`<button class="b" data-abapply="${v.value}">${v.value} übernehmen</button>`).join("")}<button class="b" id="ab-stop">Test beenden</button></div></section>`}
function wireAb(d){if(route()!=="settings"||!d.ab)return;const H={"x-api-key":cfg?.apiKey,"Content-Type":"application/json"};
  const go=$("#ab-go");if(go)go.onclick=async()=>{if(DEMO_MODE||!cfg)return;const body={variable:$("#ab-var").value,variants:[$("#ab-a").value,$("#ab-b").value],niche:setNiche};
    const r=await (await fetch(cfg.apiUrl+"/ab",{method:"POST",headers:H,body:JSON.stringify(body)})).json();if(!r.ok){$("#ab-hint").textContent="⚠ "+(r.error||"Fehler");return}PEND=null;refresh()};
  const sel=$("#ab-var");if(sel)sel.onchange=()=>{const v=(d.ab.variables||{})[sel.value];$("#ab-hint").textContent=v&&v.values?`Erlaubte Werte: ${v.values.join(" | ")}`:v&&v.kind==="number"?"Zahlen eintragen (z.B. 48 und 60).":""};
  const stop=$("#ab-stop");if(stop)stop.onclick=async()=>{if(DEMO_MODE||!cfg)return;await fetch(cfg.apiUrl+"/ab/stop",{method:"POST",headers:H});PEND=null;refresh()};
  document.querySelectorAll("[data-abapply]").forEach(b=>b.onclick=async()=>{if(DEMO_MODE||!cfg)return;const value=b.dataset.abapply;
    const post=x=>fetch(cfg.apiUrl+"/ab/apply",{method:"POST",headers:H,body:JSON.stringify(x)}).then(r=>r.json());const pv=await post({value});
    if(pv.errors||pv.error){showDiff({title:"Übernehmen nicht möglich",errors:pv.errors||[pv.error]});return}
    showDiff({title:`Gewinner übernehmen: ${pv.target}`,sub:`${(pv.diff||[]).length} Änderung${(pv.diff||[]).length===1?"":"en"} in der Nische – der Test wird beendet`,diff:pv.diff,onConfirm:async()=>{const r=await post({value,confirm:true});if(r.ok){PEND=null;refresh()}else showDiff({title:"Fehler",errors:r.errors||[r.error||"unbekannt"]})}})})}
// Diff-Dialog (Stufe 3): Feld · vorher · nachher · betroffene Accounts
function showDiff({title,sub,diff,errors,onConfirm}){const old=$("#modal");if(old)old.remove();const fv=v=>v==null?"–":typeof v==="object"?JSON.stringify(v):String(v);
  const el=document.createElement("div");el.className="modal";el.id="modal";el.innerHTML=`<div class="dlg"><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:""}${(errors||[]).map(e=>`<div class="err">⚠ ${e}</div>`).join("")}
    ${diff&&diff.length?`<div style="overflow-x:auto"><table><thead><tr><th>Feld</th><th>vorher</th><th>nachher</th><th>Accounts</th></tr></thead><tbody>${diff.map(x=>`<tr><td>${x.field}</td><td class="old">${fv(x.old)}</td><td class="new">${fv(x.new)}</td><td>${(x.accounts||[]).join(", ")}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="act"><button class="b" id="dlg-x">${onConfirm?"Abbrechen":"Schließen"}</button>${onConfirm?`<button class="save" id="dlg-ok">Bestätigen</button>`:""}</div></div>`;
  document.body.appendChild(el);$("#dlg-x").onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};const ok=$("#dlg-ok");if(ok)ok.onclick=async()=>{ok.disabled=true;ok.textContent="…";try{await onConfirm()}finally{el.remove()}}}
function wireUpload(d){const drop=$("#drop"),file=$("#file"),stat=$("#upstat");if(!drop)return;const n=nicheOf(d,route().slice(2));
  drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");upload([...e.dataTransfer.files])};file.onchange=()=>upload([...file.files]);
  async function upload(files){if(DEMO_MODE||!cfg){stat.textContent="Beispielmodus – Upload erst mit verbundenem Worker.";return}
    for(const f of files){try{stat.textContent=`${f.name}: vorbereiten…`;
      const pre=await (await fetch(cfg.apiUrl+"/sources/presign",{method:"POST",headers:{"x-api-key":cfg.apiKey,"Content-Type":"application/json"},body:JSON.stringify({niche:n.key,name:f.name,size:f.size,type:"fan"})})).json();
      if(pre.error)throw new Error(pre.error);await putChunked(pre,f,(pct,i,n)=>{stat.textContent=`${f.name}: ${pct} % hochgeladen (Teil ${i}/${n})`});
      await fetch(cfg.apiUrl+"/sources/complete",{method:"POST",headers:{"x-api-key":cfg.apiKey,"Content-Type":"application/json"},body:JSON.stringify({source_id:pre.source_id})});
      stat.textContent=`${f.name}: fertig – Clip-Jobs gestartet.`;}catch(err){stat.textContent=`${f.name}: ${err.message}`}}
    refresh();}}
async function refresh(){if(DEMO_MODE||!cfg){notice();return}try{DATA=await load(cfg);page(DATA)}catch(e){notice("Verbindung verloren.",e.message)}}
// Kein Login: der Lese-Key steckt in der Auslieferung (scripts/deploy_dashboard.sh setzt ihn ein).
// Klappt der Abruf nicht, erscheint der Grund mit einem Knopf zum erneuten Versuchen – nie ein Anmeldeformular.
function notice(msg="", detail=""){$("#nav").innerHTML="";
  const fehltKey=!cfg||!cfg.apiKey||cfg.apiKey.startsWith("__");
  $("#main").innerHTML=`<div class="gate"><h1 style="font-size:20px;margin:0 0 6px">ClipForge</h1>
    <p style="color:var(--ink2);font-size:14px;margin:0 0 12px">${fehltKey
      ? "Diese Auslieferung hat keinen Lese-Key. Neu ausrollen mit <code>bash scripts/deploy_dashboard.sh</code>."
      : (msg||"Verbindung zum Worker wird aufgebaut …")}</p>
    ${detail?`<p style="color:var(--ink3);font-size:12px;margin:0 0 12px">${detail}</p>`:""}
    <button class="save" id="retry" style="width:100%">Erneut versuchen</button>
    <p style="text-align:center;margin:10px 0 0"><a href="#" id="demo" style="color:var(--ink3);font-size:13px">Mit Beispieldaten ansehen</a></p></div>`;
  $("#retry").onclick=()=>{location.reload(true)};
  $("#demo").onclick=e=>{e.preventDefault();DEMO_MODE=true;DATA=DEMO;page(DATA)}}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.log("sw",e)));
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INSTALL=e;if(DATA&&route()==="home")page(DATA)});
window.addEventListener("appinstalled",()=>{INSTALL=null});
window.addEventListener("hashchange",()=>{if(route()!=="settings")PEND=null;if(route()!=="report")REP=null;if(route()!=="log"){LOG=null;logCat="all";logQ=""}if(route()!=="inbox"){INB=null;inbFilter="open";inbKind="all"}if(route()!=="calendar"){CAL=null;calWeek=0;calSel=null}if(route()!=="library"){LIB=null;libQ="";libStatus="all";libAcc="all";libSrc="all";libSort="new";libScore=0}if(DATA)page(DATA)});
(async()=>{
  if(!cfg){try{cfg=JSON.parse(localStorage.getItem("clipforge.cfg")||"null")}catch(e){}}   // Altbestand aus früheren Ständen
  if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith("__")){notice();return}
  for(let versuch=1;versuch<=3;versuch++){
    try{DATA=await load(cfg);page(DATA);return}
    catch(e){ notice("Der Worker antwortet gerade nicht.", `Versuch ${versuch} von 3: ${e.message}`); await new Promise(r=>setTimeout(r,1500*versuch)); }
  }
  notice("Der Worker antwortet nicht.","Der Lese-Key steckt in der Seite – es liegt nicht an einer Anmeldung. Prüfe den Worker (wrangler deploy) und versuche es erneut.");
})();
setInterval(async()=>{if(cfg&&!DEMO_MODE){try{DATA=await load(cfg);page(DATA)}catch(e){console.log("Aktualisieren fehlgeschlagen:",e.message)}}},30000);
</script>
</body>
