<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<!--
  DATENVERTRAG – GET {apiUrl}/dashboard, Header x-api-key. Ergänzt gegenüber v1:
  accounts[]: { id, handle, niche, platform:"tiktok", url, followers, followers_7d, views_7d, views_30d, earnings_30d, avg_views, posts_7d, paused, reason }
  niches[]:   { key, label, color, accounts:[ids] }
  sources[]:  { id, niche, name, size_mb, type:"paid|fan", stage:0..7, progress, clips, error, added, campaign_id }
              stage: 0 Upload · 1 Transkript · 2 Momentwahl · 3 Schnitt · 4 QA · 5 Geplant · 6 Gepostet · 7 Eingereicht
  posts[]:    { id, account, niche, url, thumb, caption, posted_at, views, likes, type, campaign }
  campaigns[] (+niche, paid_out_pct), totals, history, insights, tasks, pipeline, forecast, goal_monthly wie v1.
  Upload: POST /sources/presign {niche,name,size,type} -> {upload_url,source_id}; PUT upload_url (Browser→R2); POST /sources/complete {source_id}
-->
<style>
:root{--bg:#0C0D12;--panel:#14161D;--panel2:#1A1D26;--line:#262A35;--ink:#F2F1EC;--ink2:#A9ABB6;--ink3:#6B6E7B;
 --flame:#FF5A1F;--violet:#8B5CF6;--gold:#FACC15;--ok:#3DD68C;--warn:#F5A524;--bad:#F0564A;--r:14px;--font:"Manrope",system-ui,sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F4F3EF;--panel:#FFFFFF;--panel2:#F8F7F3;--line:#E4E2DB;--ink:#16171C;--ink2:#5B5E6B;--ink3:#8E909B}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.45}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:4px 6px 18px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--flame);position:relative}
.brand i:after{content:"";position:absolute;inset:7px 9px;background:var(--bg);clip-path:polygon(60% 0,20% 55%,48% 55%,35% 100%,80% 40%,52% 40%)}
.nl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.nl:hover{background:var(--panel2)}.nl.on{background:var(--panel2);color:var(--ink)}
.nl .sw{width:10px;height:10px;border-radius:50%;flex:none}
.nl small{margin-left:auto;font-weight:500;color:var(--ink3);font-size:12px}
.nh{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:16px 10px 6px}
main{padding:22px 26px 60px;max-width:1280px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:24px;margin:0;letter-spacing:-.02em;font-weight:800}
.top .meta{font-size:13px;color:var(--ink3);display:flex;gap:10px;align-items:center}
.live{font-size:12px;color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:6px}.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,214,140,.5)}70%{box-shadow:0 0 0 8px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}
button.b{font:inherit;font-weight:700;font-size:13px;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
h2{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}h2 span{font-size:12px;font-weight:500;color:var(--ink3)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.kpi span{font-size:12px;color:var(--ink3)}.kpi small{display:block;font-size:12px;color:var(--ok);font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.rank{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.rank.g{background:var(--gold);color:#111}.rank.s{background:#C0C0C0;color:#111}.rank.b{background:#CD7F32;color:#111}
.acct{display:flex;align-items:center;gap:10px}.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.acct .h{font-weight:700}.acct .h a:hover{text-decoration:underline}.acct .n{font-size:11px;color:var(--ink3)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.pill.v{background:color-mix(in srgb,var(--violet) 18%,transparent);color:#B197FF}.pill.f{background:color-mix(in srgb,var(--flame) 18%,transparent);color:var(--flame)}
.nhead{display:flex;align-items:center;gap:14px}.nhead .sw{width:14px;height:14px;border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:block}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card .stats div{font-size:11px;color:var(--ink3)}.card .stats b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.card .links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.card .links a{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.step{padding:8px 6px 6px;border-radius:8px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:11px;color:var(--ink3)}
.step b{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 4px;background:var(--line);color:var(--ink2);font-size:10px;line-height:18px;font-weight:800}
.step.done{color:var(--ink2)}.step.done b{background:var(--ok);color:#111}
.step.cur{border-color:var(--flame);color:var(--ink)}.step.cur b{background:var(--flame);color:#fff;animation:pulse2 1.4s infinite}
.step.err{border-color:var(--bad);color:var(--bad)}.step.err b{background:var(--bad);color:#fff}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,90,31,.5)}70%{box-shadow:0 0 0 7px rgba(255,90,31,0)}100%{box-shadow:0 0 0 0 rgba(255,90,31,0)}}
.src{padding:12px 0;border-top:1px solid var(--line)}.src:first-of-type{border-top:0}
.src .t{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.src .t b{font-size:14px}.src .t span{font-size:12px;color:var(--ink3)}
.src .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}.src .bar i{display:block;height:100%;background:var(--flame)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink3);font-size:13px;cursor:pointer}.drop.over{border-color:var(--flame);color:var(--ink)}.drop b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.up{font-size:12px;color:var(--ink2);margin-top:8px;min-height:16px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.post{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:block}
.post .th{aspect-ratio:9/16;background:linear-gradient(160deg,var(--panel2),var(--line));display:flex;align-items:flex-end;padding:8px;background-size:cover;background-position:center}
.post .th span{background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px;font-weight:700;font-size:11px}
.post .c{padding:8px;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stage{position:relative;padding:12px 12px 12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.stage:after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:18px}.stage:last-child:after{content:""}
.stage .st{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}.dot.ok{background:var(--ok)}.dot.error{background:var(--bad)}.dot.running{background:var(--flame);animation:pulse2 1.4s infinite}
.stage .si{font-size:11px;color:var(--ink3);margin-top:4px}
.ev{font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}.ev:first-of-type{border-top:0}.ev time{color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.task:first-of-type{border-top:0}.task b{width:8px;height:8px;border-radius:50%;flex:none;background:var(--flame)}.task.join b{background:var(--gold)}.task.review b{background:var(--warn)}.task a{color:var(--ink2);font-size:12px;margin-left:auto}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:10px}.bars div{flex:1;background:var(--line);border-radius:4px 4px 0 0;position:relative;min-height:3px}.bars div.cur{background:var(--flame)}.bars div:after{content:attr(data-w);position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--ink3);margin-top:4px}
.empty{color:var(--ink3);font-size:13px;padding:6px 0}
.gate{max-width:420px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}.gate input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 10px}.gate button{width:100%;font:inherit;font-weight:800;padding:11px;border-radius:10px;border:0;background:var(--flame);color:#fff;cursor:pointer}
.banner{font-size:12px;color:var(--ink3);margin:-8px 0 12px}
@media (max-width:860px){.app{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;padding:12px}.nh,.brand{display:none}.nl small{display:none}main{padding:14px}.g2,.g4{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}.stage:after{content:""}.steps{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n||0).toLocaleString("de-DE"), k=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?Math.round(n/1000)+"k":fmt(n), money=(n,c="$")=>fmt(n)+" "+c;
const ago=i=>{const m=Math.max(0,Math.round((Date.now()-new Date(i))/60000));return m<60?`vor ${m} min`:m<1440?`vor ${Math.floor(m/60)} h`:`vor ${Math.floor(m/1440)} d`};
const tm=i=>new Date(i).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const monthLabel=m=>{const [y,mo]=(m||"").split("-");const n=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];return mo?`${n[+mo-1]} ${y}`:""};
let cfg=(CONFIG.apiUrl&&CONFIG.apiKey)?{...CONFIG}:null, DATA=null, DEMO_MODE=false, sortKey="earnings_30d";
async function load(c){const r=await fetch(c.apiUrl+"/dashboard",{headers:{"x-api-key":c.apiKey}});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
const route=()=>location.hash.replace("#","")||"home";
const nicheOf=(d,key)=>(d.niches||[]).find(n=>n.key===key);
const av=(a,d)=>`<span class="av" style="background:${nicheOf(d,a.niche)?.color||"#555"}">${a.id}</span>`;

function nav(d){const r=route();
  $("#nav").innerHTML=`<div class="brand"><i></i>ClipForge</div>
  <a class="nl ${r==="home"?"on":""}" href="#home">Übersicht<small>${d.accounts.length} Accounts</small></a>
  <a class="nl ${r==="pipeline"?"on":""}" href="#pipeline">Pipeline<small>${d.pipeline?.jobs?.length||0} aktiv</small></a>
  <div class="nh">Nischen</div>
  ${(d.niches||[]).map(n=>`<a class="nl ${r==="n:"+n.key?"on":""}" href="#n:${n.key}"><span class="sw" style="background:${n.color}"></span>${n.label}<small>${n.accounts.join(", ")}</small></a>`).join("")}
  <div class="nh">Sonstiges</div>
  <a class="nl ${r==="tasks"?"on":""}" href="#tasks">Aufgaben<small>${(d.tasks||[]).length}</small></a>`;}

function leaderboard(d,filterNiche){
  const acc=d.accounts.filter(a=>!filterNiche||a.niche===filterNiche).slice().sort((a,b)=>(b[sortKey]||0)-(a[sortKey]||0));
  const th=(key,label)=>`<th class="r" data-k="${key}">${label}${sortKey===key?" ▾":""}</th>`;
  return `<table><thead><tr><th>#</th><th>Account</th>${th("followers","Follower")}${th("followers_7d","+7d")}${th("likes_total","Likes gesamt")}${th("views_7d","Views 7d")}${th("views_30d","Views 30d")}${th("avg_views","Ø/Clip")}${th("earnings_30d","Einnahmen 30d")}<th>Status</th></tr></thead><tbody>
  ${acc.map((a,i)=>`<tr><td><span class="rank ${["g","s","b"][i]||""}">${i+1}</span></td>
   <td><div class="acct">${av(a,d)}<div><div class="h"><a href="${a.url}" target="_blank" rel="noopener">${a.handle}</a></div><div class="n">${nicheOf(d,a.niche)?.label||a.niche} · ${a.platform||"tiktok"}</div></div></div></td>
   <td class="r">${k(a.followers)}</td><td class="r" style="color:var(--ok)">+${k(a.followers_7d||0)}</td><td class="r">${k(a.likes_total||0)}</td><td class="r">${k(a.views_7d)}</td><td class="r">${k(a.views_30d)}</td><td class="r">${k(a.avg_views)}</td><td class="r"><b>${money(a.earnings_30d)}</b></td>
   <td>${a.paused?`<span class="pill warn">pausiert</span>`:(a.followers===0?`<span class="pill">neu</span>`:`<span class="pill ok">aktiv</span>`)}</td></tr>`).join("")}</tbody></table>`;}

function stepper(s){return `<div class="steps">${STAGES.map((n,i)=>{const cls=s.error&&i===s.stage?"err":i<s.stage?"done":i===s.stage?"cur":"";return `<div class="step ${cls}"><b>${i<s.stage?"✓":i+1}</b>${n}</div>`}).join("")}</div>`}
function sourceRow(s){return `<div class="src"><div class="t"><b>${s.name}</b><span>${s.size_mb} MB · ${s.type==="paid"?`<span class="pill f">Kampagne</span>`:`<span class="pill v">Fan</span>`} · ${s.clips||0} Clips · ${ago(s.added)}</span></div>
  ${stepper(s)}${s.error?`<div class="up" style="color:var(--bad)">⚠ ${s.error}</div>`:(s.stage<5&&s.progress>0?`<div class="bar"><i style="width:${Math.round(s.progress*100)}%"></i></div>`:"")}</div>`}
function dropzone(n){return `<div class="drop" id="drop"><b>Video hierher ziehen oder klicken</b>MP4/MOV bis 5 GB · Nische „${n.label}" · Clip-Jobs für ${n.accounts.join(" + ")} starten automatisch<input type="file" id="file" accept="video/*" multiple style="display:none"></div><div class="up" id="upstat"></div>`}
function postsGrid(posts){return posts.length?`<div class="posts">${posts.map(p=>`<a class="post" href="${p.url}" target="_blank" rel="noopener"><div class="th" ${p.thumb?`style="background-image:url('${p.thumb}')"`:""}><span>${k(p.views)} ▶</span></div><div class="c">${p.account} · ${p.caption}</div></a>`).join("")}</div>`:`<div class="empty">Noch keine Posts.</div>`}
function pipelineBlock(d,compact){const pl=d.pipeline||{stages:[],jobs:[],queue:{},events:[]};
  return `<div class="flow">${pl.stages.map(s=>`<div class="stage"><div class="st"><span class="dot ${s.status}"></span>${s.label}</div><div class="si">${s.info||""}</div></div>`).join("")}</div>
  ${pl.jobs.length?`<div style="margin-top:12px">${pl.jobs.map(j=>`<div class="src"><div class="t"><b>${j.label}</b><span>seit ${ago(j.started).replace("vor ","")}</span></div><div class="bar"><i style="width:${Math.round((j.progress||0)*100)}%"></i></div><div class="up">${j.step||""}</div></div>`).join("")}</div>`:""}
  ${compact?"":`<div style="margin-top:12px">${(pl.events||[]).slice(0,12).map(e=>`<div class="ev"><time>${tm(e.at)}</time><div>${e.text}</div></div>`).join("")}</div>`}`}

function page(d){const r=route(); nav(d);
  const banner=DEMO_MODE?`<div class="banner">Beispieldaten – noch nicht mit dem Worker verbunden</div>`:""; let html="";
  if(r==="home"){const t=d.totals,profit=t.revenue-t.costs,max=Math.max(1,...d.history.map(h=>h.revenue));
    html=`<div class="top"><h1>Übersicht</h1><div class="meta">${monthLabel(d.month)} <span class="live"><i></i>live</span><button class="b" id="rf">Aktualisieren</button></div></div>${banner}
    <div class="grid g4" style="margin-bottom:14px"><div class="kpi"><b>${money(profit)}</b><span>Gewinn · ≈ ${fmt(profit*(d.eur_rate||0.92))} €</span><small>+${money(t.week_delta)} diese Woche</small></div><div class="kpi"><b>${money(t.revenue)}</b><span>Umsatz ausgezahlt</span></div><div class="kpi"><b>${k(d.accounts.reduce((a,x)=>a+(x.views_7d||0),0))}</b><span>Views 7 Tage · alle Accounts</span></div><div class="kpi"><b>${k(d.accounts.reduce((a,x)=>a+(x.followers||0),0))}</b><span>Follower gesamt</span><small>+${k(d.accounts.reduce((a,x)=>a+(x.followers_7d||0),0))} diese Woche</small></div></div>
    <section><h2>Rangliste Accounts <span>Spalte anklicken = sortieren · Handle öffnet TikTok</span></h2>${leaderboard(d)}</section>
    <div class="grid g2"><section><h2>Pipeline <span><a href="#pipeline">alles →</a></span></h2>${pipelineBlock(d,true)}</section>
    <section><h2>Umsatz pro Woche</h2><div class="bars">${d.history.map((h,i)=>`<div class="${i===d.history.length-1?"cur":""}" style="height:${Math.max(4,h.revenue/max*100)}%" data-w="${h.week}" title="${money(h.revenue)}"></div>`).join("")}</div><div style="height:18px"></div>
    <h2 style="margin-top:14px">Gelernt diese Woche</h2><div class="ev">Bester Hook<div style="margin-left:auto;color:var(--ink2)">${d.insights.best_hook}</div></div><div class="ev">Beste Uhrzeit<div style="margin-left:auto;color:var(--ink2)">${d.insights.best_slot}</div></div><div class="ev">Über Schwelle<div style="margin-left:auto;color:var(--ink2)">${Math.round(d.insights.qualified_rate*100)} %</div></div></section></div>
    <section><h2>Nischen</h2><div class="cards">${d.niches.map(n=>{const acc=d.accounts.filter(a=>n.accounts.includes(a.id));const v=acc.reduce((s,a)=>s+(a.views_7d||0),0),e=acc.reduce((s,a)=>s+(a.earnings_30d||0),0);const src=d.sources.filter(s=>s.niche===n.key&&s.stage<5).length;
      return `<a class="card" href="#n:${n.key}"><div class="row"><b style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:${n.color};display:inline-block"></span>${n.label}</b><span class="pill">${acc.length} Accounts</span></div><div class="stats"><div><b>${k(v)}</b>Views 7d</div><div><b>${money(e)}</b>30 Tage</div><div><b>${src}</b>in Arbeit</div></div></a>`}).join("")}</div></section>`;
  } else if(r==="pipeline"){
    html=`<div class="top"><h1>Pipeline</h1><div class="meta"><span class="live"><i></i>${d.pipeline.jobs.length} Job(s) aktiv</span><button class="b" id="rf">Aktualisieren</button></div></div>${banner}
    <section>${pipelineBlock(d,false)}</section>
    <section><h2>Alle Quellen im Workflow</h2>${d.sources.map(sourceRow).join("")||`<div class="empty">Keine Quellen.</div>`}</section>`;
  } else if(r.startsWith("n:")){const n=nicheOf(d,r.slice(2)); if(!n){location.hash="home";return}
    const acc=d.accounts.filter(a=>n.accounts.includes(a.id)), src=d.sources.filter(s=>s.niche===n.key), posts=d.posts.filter(p=>p.niche===n.key).sort((a,b)=>new Date(b.posted_at)-new Date(a.posted_at)), camps=d.campaigns.filter(c=>c.niche===n.key);
    html=`<div class="top"><div class="nhead"><span class="sw" style="background:${n.color}"></span><h1>${n.label}</h1></div><div class="meta">${acc.length} Accounts · ${src.filter(s=>s.stage<5).length} in Arbeit <button class="b" id="rf">Aktualisieren</button></div></div>${banner}
    <section><h2>Accounts <span>Handle öffnet das Profil</span></h2><div class="cards">${acc.map(a=>`<div class="card"><div class="row"><div class="acct">${av(a,d)}<div><div class="h"><a href="${a.url}" target="_blank" rel="noopener">${a.handle}</a></div><div class="n">${a.platform||"tiktok"} · ${a.posts_7d||0} Posts/7d</div></div></div>${a.paused?`<span class="pill warn">pausiert</span>`:`<span class="pill ok">aktiv</span>`}</div>
      <div class="stats"><div><b>${k(a.followers)}</b>Follower <span style="color:var(--ok)">+${k(a.followers_7d||0)}</span></div><div><b>${k(a.likes_total||0)}</b>Likes gesamt</div><div><b>${k(a.views_7d)}</b>Views 7d</div><div><b>${a.videos??"–"}</b>Videos</div><div><b>${money(a.earnings_30d)}</b>30 Tage</div><div><b>${a.posts_7d||0}</b>Posts 7d</div></div>
      <div class="links"><a href="${a.url}" target="_blank" rel="noopener">Profil ↗</a>${a.paused?`<span class="pill warn">${a.reason||"pausiert"}</span>`:""}</div></div>`).join("")}</div></section>
    <section><h2>Footage hochladen <span>landet in R2 · Clip-Jobs starten automatisch</span></h2>${dropzone(n)}</section>
    <section><h2>Workflow <span>jede Quelle mit aktueller Stufe</span></h2>${src.map(sourceRow).join("")||`<div class="empty">Noch keine Quelle – lade oben ein Video hoch.</div>`}</section>
    <div class="grid g2"><section><h2>Kampagnen</h2>${camps.length?`<table><thead><tr><th>Kampagne</th><th class="r">Rate</th><th class="r">Clips</th><th class="r">Views</th><th class="r">Verdient</th><th class="r">Pool</th></tr></thead><tbody>${camps.map(c=>`<tr><td><b>${c.name}</b><div style="font-size:11px;color:var(--ink3)">${c.platform} · ${c.status}</div></td><td class="r">${c.rate_per_1k} $/1k</td><td class="r">${c.clips}</td><td class="r">${k(c.views)}</td><td class="r"><b>${money(c.earned)}</b></td><td class="r">${c.paid_out_pct??"–"} %</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Keine Kampagne in dieser Nische.</div>`}</section>
    <section><h2>Rangliste in dieser Nische</h2>${leaderboard(d,n.key)}</section></div>
    <section><h2>Letzte Posts <span>${posts.length} · klick öffnet TikTok</span></h2>${postsGrid(posts.slice(0,18))}</section>`;
  } else if(r==="tasks"){
    html=`<div class="top"><h1>Aufgaben</h1><div class="meta"><button class="b" id="rf">Aktualisieren</button></div></div>${banner}<section>${(d.tasks||[]).map(x=>`<div class="task ${x.type}"><b></b>${x.text}${x.url?`<a href="${x.url}" target="_blank" rel="noopener">Öffnen ↗</a>`:""}</div>`).join("")||`<div class="empty">Nichts offen.</div>`}</section>`;
  }
  $("#main").innerHTML=html; const rf=$("#rf"); if(rf) rf.onclick=refresh;
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{sortKey=th.dataset.k;page(d)}); wireUpload(d);}

function wireUpload(d){const drop=$("#drop"),file=$("#file"),stat=$("#upstat");if(!drop)return;const n=nicheOf(d,route().slice(2));
  drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");upload([...e.dataTransfer.files])};file.onchange=()=>upload([...file.files]);
  async function upload(files){if(DEMO_MODE||!cfg){stat.textContent="Beispielmodus – Upload erst mit verbundenem Worker.";return}
    for(const f of files){try{stat.textContent=`${f.name}: vorbereiten…`;
      const pre=await (await fetch(cfg.apiUrl+"/sources/presign",{method:"POST",headers:{"x-api-key":cfg.apiKey,"Content-Type":"application/json"},body:JSON.stringify({niche:n.key,name:f.name,size:f.size,type:"fan"})})).json();
      if(!pre.source_id) throw new Error(pre.error||"presign fehlgeschlagen");
      // Upload in Teilstücken (Multipart nach R2 über den Worker) – große Dateien bis 5 GB, Fortschritt je Teil
      const PART=pre.part_size||25*1024*1024, total=Math.ceil(f.size/PART); let done=0;
      for(let i=0;i<total;i++){const blob=f.slice(i*PART,Math.min(f.size,(i+1)*PART)); let ok=false;
        for(let tries=0;tries<3&&!ok;tries++){try{await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("PUT",`${pre.upload_url}?part=${i+1}`);x.setRequestHeader("x-api-key",cfg.apiKey);x.setRequestHeader("Content-Type","application/octet-stream");
          x.upload.onprogress=e=>{if(e.lengthComputable)stat.textContent=`${f.name}: ${Math.round((done+e.loaded)/f.size*100)} % hochgeladen (Teil ${i+1}/${total})`};
          x.onload=()=>x.status<300?res():rej(new Error("HTTP "+x.status));x.onerror=()=>rej(new Error("Upload fehlgeschlagen"));x.send(blob)});ok=true}catch(e){if(tries===2)throw e}}
        done+=blob.size;}
      stat.textContent=`${f.name}: abschließen…`;
      const fin=await (await fetch(cfg.apiUrl+"/sources/complete",{method:"POST",headers:{"x-api-key":cfg.apiKey,"Content-Type":"application/json"},body:JSON.stringify({source_id:pre.source_id})})).json();
      if(fin.error) throw new Error(fin.error);
      stat.textContent=`${f.name}: fertig – Clip-Job für ${n.accounts.join(" + ")} gestartet.`;}catch(err){stat.textContent=`${f.name}: ${err.message}`}}
    refresh();}}
async function refresh(){if(DEMO_MODE||!cfg){gate();return}try{DATA=await load(cfg);page(DATA)}catch(e){gate("Verbindung verloren: "+e.message)}}
function gate(msg=""){$("#nav").innerHTML="";$("#main").innerHTML=`<div class="gate"><h1 style="font-size:20px;margin:0 0 6px">ClipForge</h1><p style="color:var(--ink2);font-size:14px;margin:0 0 12px">Mit dem Worker verbinden (Werte aus SECRETS.local.md).</p><input id="u" placeholder="Worker-URL" value="${cfg?.apiUrl||""}"><input id="p" type="password" placeholder="Dashboard-Lese-Key"><div style="color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px">${msg}</div><button id="go">Öffnen</button><div class="banner" style="margin-top:12px;text-align:center"><a href="#" id="demo">Mit Beispieldaten ansehen</a></div></div>`;
  $("#go").onclick=async()=>{const c={apiUrl:$("#u").value.trim().replace(/\/$/,""),apiKey:$("#p").value.trim()};try{DATA=await load(c);cfg=c;localStorage.setItem("clipforge.cfg",JSON.stringify(c));DEMO_MODE=false;page(DATA)}catch(e){gate("Keine Verbindung: "+e.message)}};
  $("#demo").onclick=e=>{e.preventDefault();DEMO_MODE=true;DATA=DEMO;page(DATA)}}
window.addEventListener("hashchange",()=>{if(DATA)page(DATA)});
(async()=>{ if(!cfg){try{cfg=JSON.parse(localStorage.getItem("clipforge.cfg")||"null")}catch(e){}}
  if(cfg){try{DATA=await load(cfg);page(DATA);return}catch(e){}} gate(); })();
setInterval(async()=>{if(cfg&&!DEMO_MODE){try{DATA=await load(cfg);page(DATA)}catch(e){}}},30000);
</script>
</body>
</html>
