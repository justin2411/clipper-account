# Zwei Accounts, unterschiedliche Schnittstile. Jeder Clip läuft nur auf EINEM Account.
# Nischen: Kanalgruppe + Accounts + Fan-Caption. Footage kommt per Upload über die Nischen-Seite des Dashboards (R2);
# jeder Upload legt eine Fan-Kampagne der Nische an und startet EINEN Clip-Job für alle Accounts der Nische.
niches:
  mrbeast:
    label: "MrBeast"
    color: "#FF5A1F"
    accounts: ["A", "B"]
    caption: "Credit @mrbeast"        # Fan-Caption = "<Kontextzeile> · Credit @mrbeast #mrbeast"
    hashtags: ["#mrbeast"]
    channels:                          # YouTube-Kanäle: RSS-Hinweis bei neuen Videos + Backlog-Liste (scripts/yt_backlog.py)
      UCX6OQ3DkcsbYNE6H8uQQuVA: "MrBeast"
      UCUaT_39o1x6qWjz7K2pWcgw: "Beast Reacts"
      UC4-79UOlP48-QNGgCko5p2g: "MrBeast 2"
      UCAiLfjNXkNv24uhpzUgPa6A: "Beast Philanthropy"
accounts:
  - id: A
    niche: mrbeast
    handle: "@mrbeastfire0"
    style: moments            # krasse Szenen, Cold Open, 2-s-Hook-Text unten (65–72 %), keine Untertitel
    clipper_flags: "--clips 3 --no-hook --no-subs --no-broll --no-bgm --whisper-model small --whisper-device cpu --whisper-compute-type int8"
    text_hook:                # Branding A: weiße Bold-Schrift mit Kontur, orangener Akzentbalken darunter
      enabled: true
      seconds: 2
      style: bar
      color: "white"
      accent: "#FF5A1F"
    slots_utc: ["08:00", "11:30", "15:00", "18:30", "22:00"]   # 5 Slots alle 3,5 h; Berlin 10:00/13:30/17:00/20:30/00:00 (Sommer)
    blotato:
      tiktok: "58583"  # @mrbeastfire0 (Blotato accountId)
  - id: B
    niche: mrbeast
    handle: "@beastcrewclips"
    style: reactions          # Reaktionen/Comedy, Cold Open, 2-s-Hook-Text unten (65–72 %), keine Untertitel
    clipper_flags: "--clips 3 --no-hook --no-subs --no-broll --no-bgm --whisper-model small --whisper-device cpu --whisper-compute-type int8"
    text_hook:                # Branding B: gelbe Bold-Schrift auf lila Box
      enabled: true
      seconds: 2
      style: box
      color: "#FACC15"
      accent: "#8B5CF6"
    slots_utc: ["09:45", "13:15", "16:45", "20:15", "23:45"]   # 105 min versetzt zu A (Kollisionsschutz 90 min)
    blotato:
      tiktok: "58594"  # @beastcrewclips (Blotato accountId)

max_clips_per_source: 3      # paid: harte Obergrenze pro Quellvideo und Account (pipeline/clipper.py kappt --clips darauf)

# Fan-Content (YouTube-Kanäle MrBeast, Beast Reacts, MrBeast 2, Beast Philanthropy – worker/src/fan.ts):
# EIN Schnitt je Video, Momente nach Rang verteilt (A: 1,3,5… B: 2,4,6…), Hook-Text im Account-Stil, nie roh.
fan:
  clipper_flags: "--clips 8 --no-hook --no-subs --no-broll --no-bgm --whisper-model small --whisper-device cpu --whisper-compute-type int8"
  max_clips_per_source: 8    # Momentwahl: 20 Kandidaten → Dedupe → Top 8 (4 je Account); pipeline/moments.py
  caption: "Credit @mrbeast" # Caption = "<Hook> · Credit @mrbeast #mrbeast" (platforms/fan.py); kein Branded Content, keine Einreichung
  hashtags: ["#mrbeast"]
# Keine eingebrannten Untertitel (TikTok Auto-Captions); Hook-Text: max. 8 Wörter, 2 Zeilen, Zone 65–72 % (pipeline/overlay.py).
# Vertikale Quellen (Höhe > Breite) werden automatisch ohne Face-Tracking geschnitten (ffprobe in pipeline/clipper.py).
platform_gap_minutes: 30      # nur relevant, wenn später weitere Plattformen aktiviert werden
max_clips_per_account_per_day: 5   # Dauerbetrieb (Worker-Var MAX_CLIPS_PER_DAY); neue Accounts 7 Tage lang 3 (RAMP_*); Kollisionsschutz 90 min
