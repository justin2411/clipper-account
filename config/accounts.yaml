# Zwei Accounts, unterschiedliche Schnittstile. Jeder Clip läuft nur auf EINEM Account.
accounts:
  - id: A
    style: moments            # krasse Szenen, kurz, Textfrage-Hook, keine Untertitel
    clipper_flags: "--clips 8 --hook-v2 --no-subs --no-broll --no-bgm --whisper-model small --whisper-device cpu --whisper-compute-type int8"
    slots_utc: ["12:00", "15:00", "18:00"]        # Berlin 14/17/20
    blotato:
      tiktok: ""       # accountId aus Blotato
  - id: B
    style: reactions          # Reaktionen/Comedy, Untertitel, cinematic
    clipper_flags: "--clips 8 --hook-v2 --font-style CINEMATIC --no-broll --no-bgm --whisper-model small --whisper-device cpu --whisper-compute-type int8"
    slots_utc: ["13:00", "16:00", "19:00"]
    blotato:
      tiktok: ""

platform_gap_minutes: 30      # nur relevant, wenn später weitere Plattformen aktiviert werden
max_clips_per_account_per_day: 5
